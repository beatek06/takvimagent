name: Akşam özeti

on:
  # Asıl tetikleyici: Cloudflare Worker cron'u (worker/relay.js), dakikası dakikasına çalışır.
  repository_dispatch:
    types: [evening-summary]
  # Yedek: GitHub'ın kendi cron'u saatlerce gecikebilir, bu yüzden sadece güvenlik ağı.
  # Dakika :17, yoğun olan tam saat başlarından kaçınmak için. Kod Zürih 19:00-23:59 dışını
  # ve o gün zaten gönderilmiş özeti atlar.
  schedule:
    - cron: "17 17 * * *"
    - cron: "17 18 * * *"
    - cron: "17 19 * * *"
  workflow_dispatch:

# İki tetikleyici aynı anda gelirse sırayla çalışsın, ikisi birden mesaj atmasın.
concurrency:
  group: evening
  cancel-in-progress: false

jobs:
  evening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m agent.evening
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
